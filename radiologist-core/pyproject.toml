[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
name = "radiologist-core"
version = "0.1.0"
description = "Modeling library for the radiologist pipeline"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "radiologist-etl",
    "radiologist-utils",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "webdataset>=0.2.86",
    "lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "fsspec>=2023.1.0",
    "captum>=0.9.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
registry = [
    "onnx>=1.14.0",
    "onnxruntime>=1.18.0,<1.24.0",
    "onnxscript>=0.1.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "${version}-radiologist-core"
ignored_tag_formats = ["${version}-radiologist-*"]
update_changelog_on_bump = true

[tool.uv.build-backend]
namespace = true
module-name = "radiocovid.core"

[tool.pytest.ini_options]
testpaths = ["tests"]
