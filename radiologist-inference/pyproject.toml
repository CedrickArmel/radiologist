[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
dependencies = [
    "numpy>=2.2.0",
    "Pillow>=12.2.0",
    "onnxruntime>=1.18.0",
    "radiologist-registry>=0.1.0",
]
name = "radiologist-inference"
version = "0.1.0"
description = "ONNX inference and serving for the radiologist pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cédrick-Armel YEBOUET" }]
keywords = ["chest-xray", "medical-imaging", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

[project.optional-dependencies]
all = [
    "wandb>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.9",
    "typer>=0.9.0",
    "prometheus-client>=0.20.0",
]
cli = ["typer>=0.9.0"]
registry = ["wandb>=0.27.0"]
serve = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
]

[project.scripts]
radiologist = "radiologist.inference.cli:main"

[project.urls]
Homepage = "https://github.com/CedrickArmel/radiologist"
Repository = "https://github.com/CedrickArmel/radiologist"
Documentation = "https://cedrickarmel.github.io/radiologist/"
Issues = "https://github.com/CedrickArmel/radiologist/issues"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "${version}-radiologist-inference"
ignored_tag_formats = ["${version}-radiologist-*"]
update_changelog_on_bump = true
bump_message = "bump: radiologist-inference $current_version → $new_version"

[tool.uv.sources]
radiologist-registry = { workspace = true }

[tool.uv.build-backend]
namespace = true
module-name = "radiologist.inference"
