[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=12.2.0",
    "onnxruntime>=1.18.0",
]
name = "radiologist-inference"
version = "0.1.0"
description = "ONNX inference and serving for the radiologist pipeline"
license = { file = "../LICENSE" }
requires-python = ">=3.10"

[project.optional-dependencies]
all = [
    "wandb>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "typer>=0.9.0",
]
cli = ["typer>=0.9.0"]
registry = ["wandb>=0.27.0"]
serve = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "${version}-radiologist-inference"
ignored_tag_formats = ["${version}-radiologist-*"]
update_changelog_on_bump = true

[tool.uv.build-backend]
namespace = true
module-name = "radiocovid.inference"

[tool.pytest.ini_options]
testpaths = ["tests"]
