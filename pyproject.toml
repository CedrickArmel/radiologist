[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[dependency-groups]
lint = [
    "black>=25.12.0",
    "flake8>=7.3.0",
    "flake8-docstrings>=1.7",
    "isort>=7.0.0",
    "pre-commit>=4.5.1",
]
typing = ["mypy>=1.19.1"]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-include-markdown-plugin>=6.2",
]
release = [
    "commitizen>=4.16.4",
    "tomli>=2.0.1; python_version < '3.11'",
]
[project]
name = "radiologist"
version = "0.1.0"
description = "Fully reproducible machine-learning pipeline for Chest X-ray classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["radiologist-core[all]", "radiologist-cli"]

[project.optional-dependencies]
all = ["radiologist-cli[all]", "radiologist-utils[all]"]
core = ["radiologist-core[all]"]
etl = ["radiologist-cli[etl]"]
inference = ["radiologist-cli[inference]"]
registry = ["radiologist-cli[registry]"]
utils = ["radiologist-utils[all]"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = false
bump_message = "bump: radiologist $current_version → $new_version"
gpg_sign = true
annotated_tag = false
major_version_zero = true
prerelease_offset = 0
retry_after_failure = false
allow_abort = false
message_length_limit = 0
allowed_prefixes = [
    "Merge",
    "Revert",
    "Pull request",
    "bump:",
    "fixup!",
    "squash!",
    "amend!",
]
breaking_change_exclamation_in_title = false
use_shortcuts = false
pre_bump_hooks = []
post_bump_hooks = []
encoding = "utf-8"

# Optional: Custom styling for prompts
style = [
    [
        "qmark",
        "fg:#ff9d00 bold",
    ],
    [
        "question",
        "bold",
    ],
    [
        "answer",
        "fg:#ff9d00 bold",
    ],
    [
        "pointer",
        "fg:#ff9d00 bold",
    ],
    [
        "highlighted",
        "fg:#ff9d00 bold",
    ],
    [
        "selected",
        "fg:#cc5454",
    ],
    [
        "separator",
        "fg:#cc5454",
    ],
    [
        "instruction",
        "",
    ],
    [
        "text",
        "",
    ],
    [
        "disabled",
        "fg:#858585 italic",
    ],
]

[tool.isort]
profile = "black"
known_first_party = ["radiologist"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true

[tool.pyright]
pythonVersion = "3.10"
include = [
    "radiologist-utils/src",
    "radiologist-etl/src",
    "radiologist-core/src",
    "radiologist-inference/src",
    "radiologist-registry/src",
    "radiologist-cli/src",
    "radiologist-core/radiologist_core_tests",
    "radiologist-etl/radiologist_etl_tests",
    "radiologist-inference/radiologist_inference_tests",
    "radiologist-registry/radiologist_registry_tests",
    "radiologist-utils/radiologist_utils_tests",
    "radiologist-cli/radiologist_cli_tests",
]
exclude = ["**/__pycache__"]
# Cross-package imports (radiologist.core importing radiologist.utils, etc.)
# resolve through the editable installs `make dev-install` sets up via .pth
# files, not through this list — this only scopes what pyright indexes.
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = [
    "radiologist-core/radiologist_core_tests",
    "radiologist-etl/radiologist_etl_tests",
    "radiologist-inference/radiologist_inference_tests",
    "radiologist-registry/radiologist_registry_tests",
    "radiologist-utils/radiologist_utils_tests",
    "radiologist-cli/radiologist_cli_tests",
    "scripts_tests",
]
addopts = [
    "--import-mode=importlib",
    "--cov=radiologist",
    "--cov-report=term-missing",
    "--deselect=radiologist-core/radiologist_core_tests/test_resume_onnx_skeleton_contract.py::test_onnx_export_config_exists_and_not_wired_into_default_callbacks",
    "--deselect=radiologist-core/radiologist_core_tests/test_onnx_export_callback.py::test_on_fit_end_noop_when_no_active_wandb_run",
]

[tool.uv]
constraint-dependencies = ["fastapi<0.116.0"]

[tool.uv.build-backend]
namespace = true

[tool.uv.workspace]
members = [
    "radiologist-utils",
    "radiologist-etl",
    "radiologist-core",
    "radiologist-inference",
    "radiologist-registry",
    "radiologist-cli",
]

[tool.uv.sources]
radiologist-utils = { workspace = true }
radiologist-etl = { workspace = true }
radiologist-core = { workspace = true }
radiologist-inference = { workspace = true }
radiologist-registry = { workspace = true }
radiologist-cli = { workspace = true }
