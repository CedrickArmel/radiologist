[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[dependency-groups]
lint = [
    "black>=25.12.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pre-commit>=4.5.1",
]
typing = ["mypy>=1.19.1"]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.0.0",
]
[project]
name = "radiologist"
version = "0.1.0"
description = "Fully reproducible machine-learning pipeline for Chest X-ray classification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "python-multipart>=0.0.32",
    "radiologist-core",
    "radiologist-utils[ml]",
]

[project.optional-dependencies]
all = [
    "radiologist-core[all]",
    "radiologist-etl[all]",
    "radiologist-utils[all]",
]
etl = ["radiologist-etl"]
prefect = ["radiologist-etl[prefect]"]
registry = ["radiologist-core[registry]"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_provider = "uv"
version_scheme = "pep440"
version_files = [
    "src/__version__.py",
    "pyproject.toml:version",
]
tag_format = "$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = false
bump_message = "bump: version $current_version → $new_version"
gpg_sign = true
annotated_tag = false
major_version_zero = true
prerelease_offset = 0
retry_after_failure = false
allow_abort = false
message_length_limit = 0
allowed_prefixes = [
    "Merge",
    "Revert",
    "Pull request",
    "fixup!",
    "squash!",
    "amend!",
]
breaking_change_exclamation_in_title = false
use_shortcuts = false
pre_bump_hooks = []
post_bump_hooks = []
encoding = "utf-8"

# Optional: Custom styling for prompts
style = [
    [
        "qmark",
        "fg:#ff9d00 bold",
    ],
    [
        "question",
        "bold",
    ],
    [
        "answer",
        "fg:#ff9d00 bold",
    ],
    [
        "pointer",
        "fg:#ff9d00 bold",
    ],
    [
        "highlighted",
        "fg:#ff9d00 bold",
    ],
    [
        "selected",
        "fg:#cc5454",
    ],
    [
        "separator",
        "fg:#cc5454",
    ],
    [
        "instruction",
        "",
    ],
    [
        "text",
        "",
    ],
    [
        "disabled",
        "fg:#858585 italic",
    ],
]

[tool.isort]
profile = "black"
known_first_party = ["radiologist"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "radiologist-utils/tests",
    "radiologist-etl/tests",
    "radiologist-core/tests",
    "radiologist-inference/tests",
    "radiologist-registry/tests",
]
addopts = "--import-mode=importlib --cov=radiocovid --cov-report=term-missing"

[tool.uv.build-backend]
namespace = true

[tool.uv.workspace]
members = [
    "radiologist-utils",
    "radiologist-etl",
    "radiologist-core",
    "radiologist-inference",
    "radiologist-registry",
]

[tool.uv.sources]
radiologist-utils = { workspace = true }
radiologist-etl = { workspace = true }
radiologist-core = { workspace = true }
radiologist-inference = { workspace = true }
radiologist-registry = { workspace = true }
