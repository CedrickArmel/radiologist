[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
name = "radiologist-etl"
version = "0.1.0"
description = "ETL pipeline: raw chest X-rays to WebDataset-consumable JSONL manifest"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cédrick-Armel YEBOUET" }]
keywords = ["chest-xray", "medical-imaging", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "radiologist-utils>=0.1.0",
    "fsspec>=2026.4.0",
    "numpy>=2.2.0",
    "scikit-image>=0.25.0",
    "pandas>=2.3.0",
    "pyarrow>=24.0.0",
    "webdataset>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "rich>=15.0.0"
]

[project.optional-dependencies]
gcs = ["gcsfs>=2026.4.0"]
prefect = ["prefect>=3.7.0"]
dask = ["prefect-dask>=0.3.0"]
ray = ["prefect-ray>=0.4.0"]
beam = ["apache-beam>=2.60.0"]
all = [
    "gcsfs>=2026.4.0",
    "prefect>=3.7.0",
    "prefect-dask>=0.3.0",
    "prefect-ray>=0.4.0",
    "apache-beam>=2.60.0"
]

[project.urls]
Homepage = "https://github.com/CedrickArmel/radiologist"
Repository = "https://github.com/CedrickArmel/radiologist"
Documentation = "https://cedrickarmel.github.io/radiologist/"
Issues = "https://github.com/CedrickArmel/radiologist/issues"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "${version}-radiologist-etl" # the component name can be a prefix or suffix with or without a separator
ignored_tag_formats = ["${version}-radiologist-*"] # Avoid noise from other tags
update_changelog_on_bump = true
bump_message = "bump: radiologist-etl $current_version → $new_version"

[tool.uv.build-backend]
namespace = true
module-name = "radiologist.etl"

[tool.uv.sources]
radiologist-utils = { workspace = true }
