[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
name = "radiologist-etl"
version = "0.1.0"
description = "ETL pipeline: raw chest X-rays to WebDataset-consumable JSONL manifest"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "radiologist-utils",
    "fsspec>=2025.3.0",
    "numpy>=1.24.0",
    "scikit-image>=0.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "webdataset>=0.2.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "rich>=13.0.0",
    "prefect>=3.0.0",
    "gcsfs>=2026.4.0"
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "${version}-radiologist-etl" # the component name can be a prefix or suffix with or without a separator
ignored_tag_formats = ["${version}-radiologist-*"] # Avoid noise from other tags
update_changelog_on_bump = true

[tool.uv.build-backend]
namespace = true
module-name = "radiocovid.etl"

[tool.uv.sources]
radiologist-utils = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
