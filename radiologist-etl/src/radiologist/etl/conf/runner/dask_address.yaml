# @package runner
family: dask
# Fallback dispatch/wave size when the stage doesn't supply its own (e.g.
# the build stage, which has no top-level batch_size of its own); the
# extract stage always overrides this via its own top-level batch_size.
batch_size: 64
task_runner:
  _target_: prefect_dask.DaskTaskRunner
  address: ??? # e.g. tcp://dask-scheduler.default.svc:8786
  client_kwargs: {}
