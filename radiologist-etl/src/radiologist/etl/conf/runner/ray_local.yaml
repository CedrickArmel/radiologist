# @package runner
# Backend implemented in the deferred Ray issue (#188, excluded from this build pass).
family: ray
# Fallback dispatch/wave size when the stage doesn't supply its own (e.g.
# the build stage, which has no top-level batch_size of its own); the
# extract stage always overrides this via its own top-level batch_size.
batch_size: 64
task_runner:
  _target_: prefect_ray.RayTaskRunner
  address: null # null -> Ray starts its own local cluster
