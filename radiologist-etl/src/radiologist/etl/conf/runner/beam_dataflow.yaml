# @package runner
# Managed Beam runner. `pipeline_options` is handed to Beam verbatim, so a
# cluster runner (Flink, Spark, ...) is this same file with a different
# `pipeline_options` mapping and nothing else.
family: beam
# Fallback dispatch/wave size when the stage doesn't supply its own (e.g.
# the build stage, which has no top-level batch_size of its own); the
# extract stage always overrides this via its own top-level batch_size.
batch_size: 64
beam:
  _target_: radiologist.etl.beam_executor.BeamExecutor
  pipeline_options:
    runner: DataflowRunner
    project: ??? # GCP project id
    region: ??? # GCP region
    temp_location: ??? # gs:// scratch bucket for Dataflow
    staging_location: ??? # gs:// staging bucket for Dataflow
    sdk_container_image: null
    max_num_workers: null
  parts_dir: ??? # must be a shared remote URI, reachable by the workers
  storage_options: null
