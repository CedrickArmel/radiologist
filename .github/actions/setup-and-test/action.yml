name: Setup and test
description: >-
  Checkout, install the uv-managed workspace (Ray excluded — see #188) and run
  the test suite. Shared by ci.yml's and publish.yml's test-gate jobs so both
  install and run tests identically.

inputs:
  ref:
    description: Git ref to check out. Empty uses actions/checkout's own default.
    required: false
    default: ""
  pytest-flags:
    description: >-
      Value passed through to `make test PYTEST_FLAGS=...`. Defaults to the
      Makefile's own default (-q); ci.yml overrides it to also emit a
      coverage.xml for Codecov.
    required: false
    default: "-q"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    # ray is excluded on purpose: the Ray execution family is still under
    # development (#188) and no test requires it.
    - run: uv sync --active --all-groups --all-packages --all-extras --no-extra ray
      shell: bash
      env:
        # uv.lock is an input in CI, never an output: exit with an error when
        # it is stale rather than re-resolving it on the runner and
        # discarding the result. UV_FROZEN would silently accept the stale
        # lock instead.
        UV_LOCKED: "true"
    - run: make test PYTEST_FLAGS="${{ inputs.pytest-flags }}"
      shell: bash
      env:
        # `make test` shells out to `uv run`, which locks and syncs before
        # running. Everything it needs was installed by the step above, so
        # skip that entirely: the suite then cannot re-resolve or rewrite
        # anything. (--no-sync implies --frozen, hence no UV_LOCKED here --
        # the two are mutually exclusive.)
        UV_NO_SYNC: "true"
