[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
name = "radiologist-utils"
version = "0.1.0"
description = "Utility helpers for the radiologist pipeline"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fsspec>=2026.4.0",
    "numpy>=2.2.0",
    "Pillow>=12.2.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
all = [
    "gcsfs>=2026.4.0",
    "hydra-core>=1.3.0",
    "lightning>=2.6.0",
    "omegaconf>=2.3.0",
    "torch>=2.12.0",
    "wandb>=0.27.0"
]
gcs = ["gcsfs>=2026.4.0"]
ml = [
    "hydra-core>=1.3.0",
    "lightning>=2.6.0",
    "omegaconf>=2.3.0",
    "torch>=2.12.0"
    ]
wandb = ["wandb>=0.27.0"]


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "${version}-radiologist-utils" # the component name can be a prefix or suffix with or without a separator
ignored_tag_formats = ["${version}-radiologist-*"] # Avoid noise from other tags
update_changelog_on_bump = true

[tool.uv.build-backend]
namespace = true
module-name = "radiocovid.utils"

[tool.pytest.ini_options]
testpaths = ["tests"]
