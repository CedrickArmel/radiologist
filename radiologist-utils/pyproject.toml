[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
name = "radiologist-utils"
version = "0.1.0"
description = "Utility helpers for the radiologist pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cédrick-Armel YEBOUET" }]
keywords = ["chest-xray", "medical-imaging", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fsspec>=2026.4.0",
    "numpy>=2.2.0",
    "Pillow>=12.2.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
all = [
    "gcsfs>=2026.4.0",
    "hydra-core>=1.3.0",
    "lightning>=2.6.0",
    "omegaconf>=2.3.0",
    "PyYAML>=6.0",
    "torch>=2.12.0",
    "wandb>=0.27.0"
]
cli = ["PyYAML>=6.0"]
gcs = ["gcsfs>=2026.4.0"]
ml = [
    "hydra-core>=1.3.0",
    "lightning>=2.6.0",
    "omegaconf>=2.3.0",
    "torch>=2.12.0"
    ]
wandb = ["wandb>=0.27.0"]

[project.urls]
Homepage = "https://github.com/CedrickArmel/radiologist"
Repository = "https://github.com/CedrickArmel/radiologist"
Documentation = "https://cedrickarmel.github.io/radiologist/"
Issues = "https://github.com/CedrickArmel/radiologist/issues"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "${version}-radiologist-utils" # the component name can be a prefix or suffix with or without a separator
ignored_tag_formats = ["${version}-radiologist-*"] # Avoid noise from other tags
update_changelog_on_bump = true
bump_message = "bump: radiologist-utils $current_version → $new_version"

[tool.uv.build-backend]
namespace = true
module-name = "radiologist.utils"
