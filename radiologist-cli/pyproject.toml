[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.28,<0.10.0"]

[project]
name = "radiologist-cli"
version = "0.1.0"
description = "Unified radiologist CLI dispatcher"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cédrick-Armel YEBOUET" }]
keywords = ["chest-xray", "medical-imaging", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "radiologist-core[all]",
    "radiologist-utils>=0.1.0",
    "typer>=0.9.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
etl       = ["radiologist-etl[all]"]
registry  = ["radiologist-registry[all]"]
inference = ["radiologist-inference[all]"]
all       = ["radiologist-etl[all]", "radiologist-registry[all]", "radiologist-inference[all]"]

[project.scripts]
radiologist = "radiologist.cli.main:main"

[project.urls]
Homepage = "https://github.com/CedrickArmel/radiologist"
Repository = "https://github.com/CedrickArmel/radiologist"
Documentation = "https://cedrickarmel.github.io/radiologist/"
Issues = "https://github.com/CedrickArmel/radiologist/issues"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "${version}-radiologist-cli"
ignored_tag_formats = ["${version}-radiologist-*"]
update_changelog_on_bump = true
bump_message = "bump: radiologist-cli $current_version → $new_version"

[tool.uv.build-backend]
namespace = true
module-name = "radiologist.cli"

[tool.uv.sources]
radiologist-core = { workspace = true }
radiologist-utils = { workspace = true }
radiologist-etl = { workspace = true }
radiologist-registry = { workspace = true }
radiologist-inference = { workspace = true }
